name: Build

# Every push to main and every pull request is tested and packaged for Windows
# and Linux; the installers are attached to the run as artifacts. Pushing a tag
# named after the package.json version (v1.2.0) also publishes them as a
# GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A newer push to the same pull request supersedes the old run; main and
  # tags always run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24

jobs:
  test:
    name: Typecheck, unit tests, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

      - name: Generate fixtures
        run: node scripts/make-fixtures.mjs fixtures

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox
      # needs, and the app keeps sandbox: true — so lift the restriction rather
      # than launching with --no-sandbox, which would test a different app.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke test
        run: xvfb-run --auto-servernum -s "-screen 0 1400x900x24" node scripts/smoke.mjs fixtures/sample.pdf smoke-out

      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-out
          path: smoke-out/*.png
          retention-days: 7

  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            target: --win
            files: dist/*.exe
          - name: linux
            os: ubuntu-latest
            target: --linux
            files: |
              dist/*.AppImage
              dist/*.deb
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx electron-vite build

      # Each platform is built on its own OS: NSIS from Linux needs Wine, and
      # better-sqlite3 is packaged from the prebuild for the host it runs on.
      # Publishing is left to the release job, never to electron-builder.
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: marmalade-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The installers are named from package.json, so a tag that disagrees
      # with it would publish v1.2.0 with files called 1.1.0.
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: marmalade-*
          path: release
          merge-multiple: true

      # Re-running the job replaces the files on an existing release instead
      # of failing because the release is already there.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "Marmalade ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --verify-tag
          fi
